name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # Required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for the prod-ancestor check below

      # Releases must be merged into 'prod' first (master -> PR -> prod -> tag).
      # This blocks a publish if someone tags a commit that isn't on prod yet.
      - name: Verify tag was released from prod
        run: |
          git fetch origin prod
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/prod; then
            echo "::error::Tag ${{ github.ref_name }} (${{ github.sha }}) is not on 'prod'. Merge master into prod via PR before tagging a release."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5.1
      - name: Use latest npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test

      # No NPM_TOKEN needed: this package's npm Trusted Publisher config
      # (npmjs.com > package > Settings > Trusted Publisher) trusts this
      # exact repo + workflow filename via GitHub's OIDC token. Provenance
      # is attached automatically.
      - name: Publish to npm
        run: npm publish --access public
