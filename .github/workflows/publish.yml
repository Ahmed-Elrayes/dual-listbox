name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write    # Required for OIDC provenance
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Remove deprecated npm config
        run: npm config delete always-auth || true

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present

      - name: Sync version and Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Extract the version from the git tag
          NEW_VERSION=${GITHUB_REF_NAME#v}
          
          # Force package.json to match the git tag version
          npm version $NEW_VERSION --no-git-tag-version
          
          # Publish to npm with provenance (OIDC)
          npm publish --access public --provenance
